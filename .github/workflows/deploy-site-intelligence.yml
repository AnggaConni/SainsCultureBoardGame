name: Deploy Site Intelligence Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site-intelligence
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$TINYFISH_API_KEY" || { echo "Missing repository secret: TINYFISH_API_KEY"; exit 1; }
      - name: Deploy Worker code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.site-intelligence.jsonc
      - name: Attach TinyFish secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: printf '%s' "$TINYFISH_API_KEY" | npx --yes wrangler@4 secret put TINYFISH_API_KEY --config wrangler.site-intelligence.jsonc
      - name: Attach optional OpenAlex secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -n "$OPENALEX_API_KEY" ]; then
            printf '%s' "$OPENALEX_API_KEY" | npx --yes wrangler@4 secret put OPENALEX_API_KEY --config wrangler.site-intelligence.jsonc
          else
            echo "OPENALEX_API_KEY not supplied; basic OpenAlex requests will run without it."
          fi
      - name: Check health endpoint
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://heritage-site-intelligence.conniezz-cool.workers.dev/health -o health.json; then
              cat health.json
              python - <<'PY'
          import json
          data = json.load(open("health.json", encoding="utf-8"))
          assert data.get("ok") is True, data
          print("Worker health check passed.")
          PY
              exit 0
            fi
            sleep 4
          done
          echo "Worker was deployed, but its assumed workers.dev hostname did not pass health. Check the URL in Cloudflare and update SITE_INTEL_API_URL in js/app.js if the account subdomain differs."
          exit 1
