name: Validate site catalog and data pipeline

on:
  pull_request:
    paths:
      - "data/**"
      - "assets/**"
      - "ASSET_*.md"
      - "scripts/**"
      - "js/**"
      - ".github/workflows/**"
      - "index.html"
      - "site-intelligence-worker.js"
      - "wrangler.site-intelligence.jsonc"
      - "SITE_INTELLIGENCE_SETUP.md"
      - "tests/**"
  push:
    branches:
      - "feature/site-data-pipeline"
    paths:
      - "data/**"
      - "assets/**"
      - "ASSET_*.md"
      - "scripts/**"
      - "js/**"
      - ".github/workflows/**"
      - "index.html"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile scripts/update_data.py scripts/test_update_data.py scripts/audit_assets.py scripts/test_audit_assets.py
      - name: Run offline tests
        run: |
          python scripts/test_update_data.py
          python scripts/test_audit_assets.py
          python scripts/audit_assets.py --force
      - name: Validate runtime GLB containers and report extensions
        run: |
          python - <<'PY'
          import json
          import struct
          from pathlib import Path

          state = json.loads(Path("data/asset_audit_state.json").read_text(encoding="utf-8"))
          required = [
              "assets/models/borobudur_temple.glb",
              "assets/models/prambanan_temple.glb",
              "assets/models/komodo_dragon.glb",
          ]
          failed = False
          for path in required:
              item = state.get("assets", {}).get(path)
              if not item:
                  print(f"FAIL: file is missing from audit inventory: {path}")
                  failed = True
                  continue
              print(f"{'PASS' if item.get('validGlb') else 'FAIL'}: {path} ({item.get('sizeBytes')} bytes)")
              for issue in item.get("issues", []):
                  print(f"  - {issue}")
              try:
                  with Path(path).open("rb") as model:
                      header = model.read(12)
                      _, _, declared = struct.unpack("<4sII", header)
                      offset = 12
                      gltf = None
                      while offset + 8 <= declared:
                          chunk_length, chunk_type = struct.unpack("<II", model.read(8))
                          offset += 8
                          chunk = model.read(chunk_length)
                          offset += chunk_length
                          if chunk_type == 0x4E4F534A:
                              gltf = json.loads(chunk.decode("utf-8").rstrip(" \\t\\r\\n\\x00"))
                              break
                  used = (gltf or {}).get("extensionsUsed", [])
                  required_ext = (gltf or {}).get("extensionsRequired", [])
                  print(f"  extensionsUsed={used}; extensionsRequired={required_ext}")
              except Exception as exc:
                  print(f"  extension metadata could not be read: {exc}")
              failed = failed or not item.get("validGlb")
          if failed:
              raise SystemExit("One or more runtime GLB files are not structurally valid.")
          PY
      - name: Validate JSON and available model paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          catalog = json.loads((root / "data/sites.json").read_text(encoding="utf-8"))
          schema = json.loads((root / "data/schemas/site-catalog.schema.json").read_text(encoding="utf-8"))
          asset_manifest = json.loads((root / "data/asset_manifest.json").read_text(encoding="utf-8"))
          assert asset_manifest["canonicalDirectory"] == "assets/models"
          for asset in asset_manifest["assets"]:
              assert asset["path"].startswith("assets/models/")
              assert asset["path"].endswith(".glb")
          
          assert catalog["coordinateSystem"] == "EPSG:4326"
          assert catalog["sites"], "site catalog is empty"
          ids = [site["id"] for site in catalog["sites"]]
          assert len(ids) == len(set(ids)), "duplicate site ids"
          for site in catalog["sites"]:
              loc = site["location"]
              assert -90 <= loc["latitude"] <= 90
              assert -180 <= loc["longitude"] <= 180
              for model in site.get("models", []):
                  if model.get("status") == "available":
                      assert (root / model["file"]).is_file(), f"missing available model: {model['file']}"
          print(f"Validated {len(catalog['sites'])} curated sites and the JSON schema.")
          PY
      - name: Check JavaScript syntax
        run: |
          node --check --input-type=module < site-intelligence-worker.js
          node --test tests/site-intelligence-worker.test.mjs
          node --check js/app.js
          node --check js/sites.js
          node --check js/board.js
