name: Monthly 3D Asset Audit

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: Re-scan every GLB and refresh the root report now
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monthly-3d-asset-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test asset audit script
        run: |
          python -m py_compile scripts/audit_assets.py scripts/test_audit_assets.py
          python scripts/test_audit_assets.py
      - name: Audit repository assets
        env:
          FORCE_RUN: ${{ inputs.force_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_RUN" == "true" ]]; then
            python scripts/audit_assets.py --force
          else
            python scripts/audit_assets.py
          fi
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: 3d-asset-audit-${{ github.run_id }}
          path: |
            ASSET_AUDIT_REPORT.md
            data/asset_audit_state.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit report and inventory baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ASSET_AUDIT_REPORT.md data/asset_audit_state.json
          if git diff --cached --quiet; then
            echo "Asset inventory and report are unchanged."
            exit 0
          fi
          git commit -m "chore(assets): refresh monthly 3D asset audit"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing main before retry."
            sleep $((attempt * 5))
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
          done
          echo "Could not publish audit report after 3 push attempts."
          exit 1
