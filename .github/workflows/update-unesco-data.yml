name: Refresh UNESCO and tourism data

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_data.py"
      - "scripts/test_update_data.py"
      - ".github/workflows/update-unesco-data.yml"
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Which data sources should be refreshed?
        required: true
        type: choice
        default: all
        options:
          - all
          - unesco
          - economy
      force:
        description: Ignore local cache and force-fetch all selected sources
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh-unesco-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser for the official Tentative List report
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Run offline scraper tests
        run: python scripts/test_update_data.py
      - name: Run data refresh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          SCOPE="${INPUT_SCOPE:-all}"
          ARGS=(--scope "$SCOPE")
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          python scripts/update_data.py "${ARGS[@]}"
      - name: Archive raw source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-source-snapshots-${{ github.run_id }}
          path: data/generated/raw/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit compact normalized datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep source payloads in the workflow artifact, not in the Git history.
          for path in data/generated/manifest.json data/generated/site_registry.json data/generated/tentative_list.json data/generated/tourism_economics.json data/generated/unesco; do
            if [[ -e "$path" ]]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No normalized data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh normalized UNESCO and tourism datasets"
          # Raw snapshots are archived separately; retry a transient push timeout.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refetching main before retry."
            sleep $((attempt * 5))
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
          done
          echo "Push failed after 3 attempts."
          exit 1
